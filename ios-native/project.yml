name: SassyTalkie
options:
  bundleIdPrefix: com.sassyconsulting
  deploymentTarget:
    iOS: "14.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: Info.plist
    SWIFT_OBJC_BRIDGING_HEADER: SassyTalkie-Bridging-Header.h
    # SDK-conditional: the simulator build must link the universal-sim archive
    # (x86_64 + arm64-sim); the device build links the arm64 device archive.
    # A single combined path made the linker pick the arm64 DEVICE lib for the
    # x86_64 simulator slice → "undefined symbols / wrong architecture".
    "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(PROJECT_DIR)/target/aarch64-apple-ios/release"
    "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(PROJECT_DIR)/target/universal-sim/release"
    OTHER_LDFLAGS:
      - "-lsassytalkie_ios"
      - "-framework Security"
      - "-framework AVFoundation"
      - "-framework CoreBluetooth"
      - "-framework Network"
      - "-framework StoreKit"

targets:
  SassyTalkie:
    type: application
    platform: iOS
    sources:
      - path: "."
        includes:
          - "*.swift"
      - path: "SassyTalkie-Bridging-Header.h"
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sassyconsulting.sassytalkie
        MARKETING_VERSION: "3.2.7"
        CURRENT_PROJECT_VERSION: "83"
        CODE_SIGN_STYLE: Automatic
        # Associated Domains (Universal Links for /v/ invite links). The file is
        # hand-maintained like Info.plist; see SassyTalkie.entitlements.
        CODE_SIGN_ENTITLEMENTS: SassyTalkie.entitlements
    # NOTE: Do NOT add an `info:` block here. `info.path` makes XcodeGen GENERATE
    # (overwrite) the file on every `xcodegen generate`, and with no `properties`
    # it strips every NS*UsageDescription key — shipping a build that hits
    # __TCC_CRASHING_DUE_TO_PRIVACY_VIOLATION__ (abort_with_payload) the moment it
    # touches the mic/BLE/local-network. Info.plist is hand-maintained and wired
    # via the INFOPLIST_FILE build setting above; keep it that way.
