[package]
name = "sassytalkie-ios"
version = "1.0.0"
edition = "2021"
authors = ["Sassy Consulting LLC"]
license = "Proprietary"
description = "SassyTalkie iOS Native Core - PTT Walkie-Talkie"



[lib]
name = "sassytalkie_ios"
# staticlib only: Xcode links libsassytalkie_ios.a into the app (project.yml
# OTHER_LDFLAGS -lsassytalkie_ios). A cdylib (.dylib) can't be built/loaded for
# an iOS device target and was failing the link step.
crate-type = ["rlib", "staticlib"]

[dependencies]
# Shared cross-platform core — the SAME crypto/session/PQC engine Android and
# desktop use (re-exported in lib.rs as crate::{crypto, pqc, session}). Mirrors
# android-native's dependency on the core so iOS stops being a plaintext fork.
sassytalkie-core = { path = "../core" }

# Audio codec — pinned to the same resolvable release the desktop crate uses
# (plain "0.3" selects nothing on crates.io; only 0.3.0-rc.0 is published).
audiopus = { version = "0.3.0-rc.0", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Networking
socket2 = "0.5"

# Crypto
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
# base64 for the crypto FFI (PSK + handshake messages cross the C ABI as base64
# strings, mirroring the Android JNI seam).
base64 = "0.22"

# Concurrency
parking_lot = "0.12"

# Logging
log = "0.4"
env_logger = "0.11"

# Lock-free ring buffer for the audio capture/playback path
ringbuf = "0.3"

# Error handling
thiserror = "1.0"

[target.'cfg(target_vendor = "apple")'.dependencies]
# Apple-only FFI. These MUST stay behind the target gate: core-foundation 0.9
# unconditionally does `use std::os::unix::io` and `libc::PATH_MAX`, so listing
# it in plain [dependencies] made the crate un-checkable on a non-Apple host —
# which meant no `cargo check` of the portable logic (floor control, protocol
# framing, jitter buffer) without a Mac. Gating restores host-side verification.
core-foundation = "0.9"
core-foundation-sys = "0.8"
objc = "0.2"
block = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
