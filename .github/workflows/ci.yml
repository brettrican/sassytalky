name: CI

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'android-native/**'
      - 'core/**'
      - 'ios-native/**'
      - 'tauri-desktop/**'
      - 'cloudflare-worker/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'android-app/**'
      - 'android-native/**'
      - 'core/**'
      - 'ios-native/**'
      - 'tauri-desktop/**'
      - 'cloudflare-worker/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    name: Cloudflare Worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test

  android-jvm:
    name: Android JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: chmod +x android-app/gradlew
      - name: Run both distribution flavors
        working-directory: android-app
        run: ./gradlew testPlayDebugUnitTest testDirectDebugUnitTest --stacktrace

  rust-quality:
    name: Rust format, clippy, and native tests
    runs-on: ubuntu-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1ff72ee08e3cb84d84adba594e0a297990fc1ed3 # stable
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf
      - name: Fetch bundled libopus sources
        run: |
          set -euo pipefail
          ver=0.2.2
          curl -sSfL "https://static.crates.io/crates/audiopus_sys/audiopus_sys-${ver}.crate" \
            -o /tmp/audiopus_sys.crate
          mkdir -p /tmp/opus-src
          tar -xzf /tmp/audiopus_sys.crate -C /tmp/opus-src
          echo "OPUS_SRC_DIR=/tmp/opus-src/audiopus_sys-${ver}/opus" >> "$GITHUB_ENV"
      - name: Check formatting of changed Rust files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.rs')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Rust files."
          else
            printf 'rustfmt checking %s\n' "${files[@]}"
            rustfmt --edition 2021 --check "${files[@]}"
          fi
      - name: Clippy core
        # The repository has existing Clippy debt outside this remediation's
        # edit scope. Run the production library target now; changed Rust files
        # are separately rustfmt-gated above.
        run: cargo clippy --manifest-path core/Cargo.toml --lib --locked
      - name: Test Android native crate on host
        run: cargo test --manifest-path android-native/Cargo.toml --lib --locked
      - name: Test iOS native crate on host
        # Apple SDK deps are cfg-gated; host `cargo test --lib` exercises portable
        # logic (floor, protocol) without Xcode. Device/sim builds stay on macos.
        run: cargo test --manifest-path ios-native/Cargo.toml --lib --locked
      - name: Clippy Android native
        # JNI exports necessarily receive raw handles from the VM. They validate
        # and wrap those handles at the boundary; Clippy cannot infer that ABI.
        run: cargo clippy --manifest-path android-native/Cargo.toml --lib --locked -- -A clippy::not_unsafe_ptr_arg_deref
      - name: Clippy desktop
        run: cargo clippy --manifest-path tauri-desktop/src-tauri/Cargo.toml --lib --locked

  elf-alignment:
    name: 16 KiB ELF alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install readelf
        run: sudo apt-get update && sudo apt-get install -y binutils
      - name: Check committed JNI shared libraries
        run: |
          set -euo pipefail
          # Also scan merged native-lib / AAB-extracted .so trees when present
          # (ML Kit Translate caveat: see android-app/app/build.gradle.kts).
          # Absence of an AAB in this job is not a failure — only scan what exists.
          paths=()
          if compgen -G "android-app/app/src/main/jniLibs/*/*.so" > /dev/null; then
            paths+=(android-app/app/src/main/jniLibs)
          fi
          for d in \
            android-app/app/build/intermediates/merged_native_libs/*/out/lib \
            android-app/app/build/intermediates/merged_native_libs/*/*/out/lib
          do
            if compgen -G "$d/*/*.so" > /dev/null 2>&1; then
              paths+=("$d")
            fi
          done
          for aab in android-app/app/build/outputs/bundle/*/*.aab; do
            [ -f "$aab" ] || continue
            tmp=$(mktemp -d)
            unzip -q -o "$aab" 'base/lib/*/*.so' -d "$tmp" 2>/dev/null || true
            if compgen -G "$tmp/base/lib/*/*.so" > /dev/null 2>&1; then
              paths+=("$tmp/base/lib")
            fi
          done
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "No .so trees to scan; release workflow still checks after cargo ndk."
            exit 0
          fi
          python3 scripts/check-elf-alignment.py "${paths[@]}"

  desktop-smoke:
    name: Desktop smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tauri-desktop
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@1ff72ee08e3cb84d84adba594e0a297990fc1ed3 # stable
        with:
          toolchain: stable
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf
      - run: npm install
      - run: npm run build
      - name: Check desktop Rust host build
        working-directory: tauri-desktop/src-tauri
        run: cargo check --locked
